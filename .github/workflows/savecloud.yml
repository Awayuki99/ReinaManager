name: SaveCloud Windows
on:
  push:
    branches: [codex/google-drive-saves]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm i18n:status
      - run: dotnet build savecloud/tests/GameStub
      - run: dotnet run --project savecloud/tests/SaveCloud.Tests -- savecloud
      - run: ./scripts/build-savecloud.ps1
      - run: python scripts/test-savecloud-bridge.py
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: ./scripts/build-savecloud.ps1 -Package
      - uses: actions/upload-artifact@v6
        with:
          name: ReinaManager-SaveCloud-win-x64
          path: artifacts/ReinaManager-SaveCloud-win-x64.zip
